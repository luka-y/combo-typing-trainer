Backquote    = ['`', '~']
Backslash    = ['\', '|']
BracketLeft  = ['[', '{']
BracketRight = [']', '}']
Comma        = [',', '<']
Digit0       = ['0', ')']
Digit1       = ['1', '!']
Digit2       = ['2', '@']
